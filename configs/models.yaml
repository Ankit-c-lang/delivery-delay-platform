# Search spaces, trial counts and wall-clock caps. PLAN.md §6.4.
#
# The budget is deliberate, not arbitrary: this machine is an i5-1235U, a low-power mobile
# part with 12 threads and no usable GPU, and CatBoost will happily eat an evening. Optuna's
# `timeout` is a hard stop, and the number of trials ACTUALLY completed is logged — a budget
# you silently blow through is not a budget.
#
# Optuna runs with n_jobs=1 and the boosting library gets the threads. Nested parallelism
# (Optuna workers x library threads) thrashes this CPU and makes every timing meaningless.

seed: 42

cv:
  # TimeSeriesSplit only. KFold and StratifiedKFold are forbidden (CLAUDE.md invariant 5):
  # with as-of features and temporal drift, a random fold lets the future leak into the past.
  n_splits: 4

# Class imbalance (~7% positives): do NOT resample. Train on raw probabilities, calibrate in
# Phase 5, then tune the threshold. scale_pos_weight is run once as a logged experiment so we
# can say we tested it (§6.4).
imbalance_experiment:
  enabled: true
  model: lightgbm

models:
  lightgbm:
    trials: 40
    timeout_seconds: 900        # 15 min
    fixed:
      objective: binary
      metric: average_precision
      verbosity: -1
      n_estimators: 2000
      early_stopping_rounds: 50
    search:
      learning_rate:      {type: float, low: 0.01,  high: 0.2,  log: true}
      num_leaves:         {type: int,   low: 15,    high: 255,  log: true}
      min_child_samples:  {type: int,   low: 5,     high: 200,  log: true}
      feature_fraction:   {type: float, low: 0.5,   high: 1.0}
      bagging_fraction:   {type: float, low: 0.5,   high: 1.0}
      bagging_freq:       {type: int,   low: 1,     high: 7}
      lambda_l2:          {type: float, low: 1.0e-3, high: 10.0, log: true}

  xgboost:
    trials: 40
    timeout_seconds: 900        # 15 min
    fixed:
      objective: "binary:logistic"
      eval_metric: aucpr
      tree_method: hist         # required for enable_categorical
      enable_categorical: true
      n_estimators: 2000
      early_stopping_rounds: 50
    search:
      learning_rate:      {type: float, low: 0.01,  high: 0.2,  log: true}
      max_depth:          {type: int,   low: 3,     high: 10}
      min_child_weight:   {type: float, low: 0.5,   high: 50.0, log: true}
      subsample:          {type: float, low: 0.5,   high: 1.0}
      colsample_bytree:   {type: float, low: 0.5,   high: 1.0}
      reg_lambda:         {type: float, low: 1.0e-3, high: 10.0, log: true}

  catboost:
    # Half the trials and the longest cap: CatBoost is slowest by far on this CPU.
    trials: 20
    timeout_seconds: 1500       # 25 min
    fixed:
      loss_function: Logloss
      eval_metric: PRAUC
      iterations: 1500          # capped, per §6.4
      od_type: Iter
      od_wait: 50
      thread_count: -1
      verbose: false
      allow_writing_files: false
    search:
      learning_rate:      {type: float, low: 0.01,  high: 0.2,  log: true}
      depth:              {type: int,   low: 4,     high: 8}
      l2_leaf_reg:        {type: float, low: 1.0,   high: 20.0, log: true}
      random_strength:    {type: float, low: 1.0e-3, high: 10.0, log: true}
      bagging_temperature: {type: float, low: 0.0,  high: 1.0}
