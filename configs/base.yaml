# Paths, schema names and identifiers. Machine-specific and secret values live in .env,
# never here — this file is committed.

seed: 42

paths:
  raw_data: data/raw
  reports: reports
  fixtures: tests/fixtures

database:
  # Raw CSVs land in `raw` untouched; everything derived lives in `features`. Keeping
  # them apart means a reload never silently rewrites a derived table.
  raw_schema: raw
  features_schema: features
  analytical_table: orders_analytical

mlflow:
  # The tracking URI is NOT here: it is MLFLOW_TRACKING_URI in .env, because it differs
  # between the host (http://127.0.0.1:5000) and a container (http://mlflow:5000).
  experiment: delivery_delay
  registered_model_name: delivery_delay_classifier
  champion_alias: champion
  challenger_alias: challenger

target:
  name: is_late
  # is_late = order_delivered_customer_date.date() > order_estimated_delivery_date.date()
  # Compared at DATE granularity: the estimate is date-only (midnight), so a timestamp
  # comparison marks almost every on-time same-day delivery as late (PLAN.md §4.3).
  compare_granularity: date
  # Assert the positive rate lands in this band after ETL. Outside it means the
  # granularity bug above, not an interesting finding.
  expected_positive_rate:
    min: 0.05
    max: 0.10

population_filter:
  order_status: delivered
  require_delivered_date: true

decision:
  # The cost ratio is an ASSUMPTION, never a measurement (PLAN.md §4.7). Report it as one:
  # "under a 5:1 FN:FP cost assumption, the optimal threshold is X". A false negative is a
  # late delivery (support contact, review damage, churn risk); a false positive is a
  # proactive notification or an expedite.
  fn_fp_cost_ratio: 5.0
  # §13 Phase 5: "If the gain is under 0.005 PR-AUC, say plainly that the single model should
  # ship." Encoded so the decision is a threshold, not a mood.
  min_ensemble_gain_pr_auc: 0.005
  # SELECTION BAND: how close two models must be before PR-AUC stops deciding between them.
  #
  # Set to the amount thread count ALONE moved CatBoost's calibration-window PR-AUC in
  # DECISIONS.md D35 (0.21344 at ten threads against 0.20850 at four, on identical data and
  # identical hyperparameters). That number is this pipeline's measured reproducibility floor, so a
  # gap smaller than it is not a result — it is the environment. Claiming a winner inside the band
  # would be claiming a difference we have already proved we cannot reproduce.
  #
  # Within the band the tie is broken on SERVING COST, not on the fourth decimal place: the shipped
  # model's library has to be installed in the API image, and that ranges from 10 MB for LightGBM to
  # 269 MB for CatBoost (measured, D38). The rule exists so this is a threshold rather than a mood,
  # the same reason min_ensemble_gain_pr_auc is a number in this file and not a judgement call.
  selection_band_pr_auc: 0.005
  # Installed wheel size per library, in MB, measured in the dev venv with `du -sm`. Used only to
  # order models inside the band; it never overrides a difference larger than it.
  serving_cost_mb:
    lightgbm: 10
    xgboost: 85
    catboost: 269

  # How the calibration window is divided between fitting blend weights and fitting the
  # calibrator. "interleaved" keeps both halves at the window's base rate; "temporal" splits
  # by date but leaves halves at 5.74% and 13.77% (DECISIONS.md D28).
  calibration_split: interleaved

metrics:
  # PR-AUC leads: with ~7% positives, ROC-AUC is flattering (PLAN.md §4.6).
  primary: average_precision
  secondary:
    - roc_auc
    - brier_score
    - recall_at_capacity
  # "If ops can review the top 10% of orders daily, what share of late orders do we catch?"
  review_capacity: 0.10
