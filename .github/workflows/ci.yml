# Phase 0: lint only. Phase 10 adds pytest with a Postgres service container, the ETL
# smoke test on a synthetic fixture, and coverage (PLAN.md §10.3).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + black
    # Pinned, not ubuntu-latest: the ubuntu-latest label migrates to Ubuntu 26 on
    # 2026-10-19, and 24.04 is what the dev VM runs. Same reasoning as pinning the
    # interpreter to 3.12 (PLAN.md §11) — CI should not change under us mid-project.
    runs-on: ubuntu-24.04
    steps:
      # v7: v4/v5 still target Node 20, which GitHub now force-runs on Node 24 and
      # warns about on every run.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Must match PLAN.md §11, the venv, python:3.12-slim and CLAUDE.md. A lockfile
          # is only valid for the interpreter that produced it (§18 A7).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: black --check
        run: black --check .
