# Infrastructure plus the API (PLAN.md §10.2). A `trainer` service under
# `profiles: ["training"]` is defined but does not start by default.
#
# `docker compose up` is the whole deployment story ONLY once a model is registered. On a clean
# machine the registry is empty, the API cannot resolve @champion, and it will correctly report
# itself unhealthy. Run `make bootstrap` first (§18 A5).
#
# NEVER `docker compose down -v`: it deletes named volumes, and run from the wrong directory it
# deletes another project's.
#
# The project name below is explicit so container, volume and network prefixes never depend on the
# directory name. This machine also runs realtime-fraud-detection, and an ambiguous project name is
# how one project's teardown deletes another's volume.
name: delay-prediction

services:
  postgres:
    image: postgres:16-alpine
    container_name: delay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Keep the cluster in a subdirectory of the mount point: the volume root then
      # stays empty, which lets the entrypoint tell "fresh volume" from "existing data".
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # 127.0.0.1 only. The container always listens on 5432 internally.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 is load-bearing, not decoration. During initdb the official
      # entrypoint starts a TEMPORARY server with --listen_addresses='' (Unix socket
      # only). A bare `pg_isready` reaches that socket and reports healthy while the
      # real server is still seconds away, so dependents start and get "connection
      # refused". Forcing TCP means the check can only pass once the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    container_name: delay-mlflow
    restart: unless-stopped
    # Run as the host user so files written into the bind mounts stay owned by us and
    # can be removed without sudo. id -u is 1000 on this machine.
    user: "1000:1000"
    environment:
      # MLflow 3 validates the Host header against an allowlist as DNS-rebinding protection, and
      # the DEFAULT list is localhost addresses plus private-IP patterns only. A container reaching
      # the server by its Compose service name sends `Host: mlflow:5000`, which matches nothing, so
      # every registry call comes back 403 "Invalid Host header - possible DNS rebinding attack
      # detected" (DECISIONS.md D40). Setting this variable REPLACES the defaults rather than
      # extending them, so the localhost entries have to be repeated or host-side tooling breaks.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:*,localhost:*,127.0.0.1:*,[[]::1]:*,localhost,127.0.0.1"

    # A file-based backend store is required for the Model Registry — plain ./mlruns
    # filesystem tracking does not support it (PLAN.md §7). Four slashes: an absolute
    # path. --serve-artifacts proxies artifact I/O through the tracking server, so
    # clients never need to see /mlartifacts on their own filesystem.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlartifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      # Bind mounts, not named volumes: the run database and the artifacts are the
      # project's record and should be visible and backup-able from the host.
      - ./mlflow:/mlflow
      - ./mlartifacts:/mlartifacts
    healthcheck:
      # Python, not `curl -f`: this image ships neither curl nor wget reliably, and a
      # healthcheck whose binary is missing fails permanently and silently-looking.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: delay-api:local
    container_name: delay-api
    restart: unless-stopped
    user: "1000:1000"
    environment:
      # http://mlflow:5000, not 127.0.0.1: inside the network the host loopback is the
      # container's own. This is the one variable that MUST differ from the host's .env value,
      # which is why it is set here explicitly rather than passed through.
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: ${MODEL_URI:-models:/delivery_delay_classifier@champion}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # Host 8001 -> container 8000. 8000 belongs to realtime-fraud-detection on this machine
      # (CLAUDE.md invariant 10). The container always listens on 8000 internally.
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    # Deliberately NOT depends_on postgres. §10.2 lists both, but the serving path was measured
    # (DECISIONS.md D38) and the API never opens a database connection: the as-of snapshots it
    # needs are bundled inside the artifact, which is the whole point of §6.2. Declaring a
    # dependency the service does not have would delay its start behind an unrelated healthcheck
    # and misdescribe the graph to anyone reading this file.

  # Optional: the training stack, which needs the FULL requirements.txt rather than the serving
  # subset. `profiles` keeps it out of a plain `docker compose up` — it is not part of the
  # deployment, it is a convenience for running a training job in a container instead of the venv.
  #
  # NOT BUILT OR VERIFIED. Its image would carry optuna, shap, matplotlib and all three boosting
  # libraries, roughly an order of magnitude larger than the API image, and PLAN.md §3 lists the
  # trainer profile as the first thing to cut under time pressure. Build it with
  # `docker compose --profile training build trainer` when it is actually wanted.
  trainer:
    profiles: ["training"]
    build:
      context: .
      dockerfile: Dockerfile.trainer
    image: delay-trainer:local
    container_name: delay-trainer
    user: "1000:1000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    command: ["python", "-m", "src.training.train", "--version", "v1"]

volumes:
  pgdata:
    name: delay-prediction-pgdata
