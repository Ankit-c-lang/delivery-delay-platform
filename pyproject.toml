[project]
name = "delivery-delay-platform"
version = "0.1.0"
description = "Leakage-safe delivery-delay prediction with a full MLOps lifecycle"
requires-python = ">=3.12"

# Dependencies are deliberately NOT declared here. PLAN.md §11 keeps them in three
# requirements files so the API image can install a serving-only subset; duplicating them
# in a [project.dependencies] table would create a second source of truth.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "api", "tests", "scripts"]
extend-exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Assertions and reused fixtures are the point of a test file.
"scripts/*" = [
    # Same reason as src/training and tests: `X` is the conventional name for a feature matrix, and
    # renaming it to satisfy a linter would make the code read worse than the convention it follows.
    "N803",
    "N806",
]
"tests/*" = ["S101", "N803", "N806"]
# N803/N806: `X` for a feature matrix and `y` for labels is the sklearn convention every ML
# reader expects. Renaming them to satisfy pep8-naming would make this code read worse, not
# better, so the exception is scoped to the modelling packages rather than applied globally.
"src/training/*" = ["N803", "N806"]
"src/evaluation/*" = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["src", "api"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "notebooks"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=src --cov-report=term-missing"
# The repo root on sys.path, so `src` imports resolve however pytest is invoked.
#
# `python -m pytest` adds the cwd implicitly and the bare `pytest` console script does not, so the
# suite passed for ten phases via the Makefile and then failed on its first CI run with
# `ModuleNotFoundError: No module named 'src'` (DECISIONS.md D44). Fixing it here rather than in the
# workflow means the project does not depend on which entry point the caller happens to use.
pythonpath = ["."]
markers = [
    "slow: needs the real dataset or a full training run; excluded from CI",
    # Corrected in Phase 10: this said "needs a live Postgres or MLflow server", which understated
    # it. These tests assert facts about the REAL Olist data — 99,224 review rows, exact
    # leading-zero counts — so they need a service that has already been loaded with it. That is
    # why they cannot run in CI even with a Postgres service container available.
    "integration: needs a live Postgres or MLflow server ALREADY LOADED with the project's data",
    # The CI-safe counterpart: runs the same loader and transform against committed synthetic CSVs
    # in a database it creates and drops itself. Needs Postgres, never needs the dataset.
    "ci_etl: runs the real ETL on synthetic fixtures in a throwaway database (PLAN.md §10.3)",
]
filterwarnings = [
    # Fail on pytest's own removal warnings. These are always our mistake, never a
    # third-party one, and a silent one costs a broken suite on the next pytest major.
    "error::pytest.PytestRemovedIn10Warning",
    # MLflow warns generically that integer signature columns cannot hold nulls. Verified not
    # to apply here: every integer column in the signature is NOT NULL in
    # features.orders_analytical, so a null is a contract violation and schema enforcement
    # rejecting it is what CLAUDE.md asks for. Guarded by
    # TestIntegerSchemaIsSafe::test_every_integer_signature_column_is_not_null_in_the_table,
    # which fails if a nullable integer feature is ever added.
    # The `.` matches the colon in "Hint:" — a literal colon would be read as the
    # filterwarnings category separator and raise at collection time.
    "ignore:Hint. Inferred schema contains integer column",
]
